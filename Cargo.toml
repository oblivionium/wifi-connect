[package]
name = "wifi"
version = "0.1.0"
edition = "2021"
description = "Cross-platform college captive portal login and logout"

[[bin]]
name = "wifi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = "3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rpassword = "7"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
