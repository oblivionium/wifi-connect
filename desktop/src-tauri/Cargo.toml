[package]
name = "wifi-desktop"
version = "0.1.0"
description = "Settings window for College Wi-Fi"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
wifi = { path = "../.." }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
