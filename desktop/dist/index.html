<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>College Wi-Fi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <div class="menu-wrap" id="menu-wrap">
        <button id="logo-button" class="logo-button" aria-label="Open pages" aria-expanded="false">
          <img src="wifi-mark.png" alt="College Wi-Fi" />
        </button>
        <nav id="page-menu" class="page-menu" aria-label="Pages" aria-hidden="true">
          <button data-page="home" class="page-link active">Connect</button>
          <button data-page="credentials" class="page-link">Credentials</button>
          <button data-page="settings" class="page-link">Settings</button>
        </nav>
      </div>
      <span class="app-name">College Wi-Fi</span>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <section id="page-home" class="page home-page" aria-label="Connect">
        <button id="connection-toggle" class="connection-toggle" type="button" role="switch" aria-checked="false" aria-label="Connect to college Wi-Fi">
          <span class="toggle-track"><svg class="power-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M5.65 5.65a9 9 0 1 0 12.7 0"/></svg></span>
        </button>
        <p id="portal-status" class="portal-status" role="status" aria-live="polite">Checking status</p>
      </section>

      <section id="page-credentials" class="page form-page" aria-label="Credentials" hidden>
        <form id="credentials-form" autocomplete="on">
          <input id="username" name="username" autocomplete="username" placeholder="Username" aria-label="Username" required />
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
          <button class="form-action" type="submit">Save</button>
        </form>
        <p id="credentials-status" class="message" aria-live="polite"></p>
      </section>

      <section id="page-settings" class="page settings-page" aria-label="Settings" hidden>
        <label class="setting-row"><span>Notifications</span><span class="switch"><input id="notifications-toggle" type="checkbox" /><i></i></span></label>
        <label class="setting-row"><span>Auto reconnect</span><span class="switch"><input id="auto-relogin" type="checkbox" /><i></i></span></label>
        <button id="create-shortcut" class="shortcut-action" type="button">Create shortcut</button>
        <p id="settings-status" class="message" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
